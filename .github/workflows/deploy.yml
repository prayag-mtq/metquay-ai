name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload immutable assets
        run: aws s3 sync out/_next s3://${{ vars.BUCKET }}/_next --delete --cache-control "public,max-age=31536000,immutable"
      - name: Upload pages and files
        run: aws s3 sync out s3://${{ vars.BUCKET }} --delete --exclude "_next/*" --cache-control "public,max-age=0,must-revalidate"
      - name: Publish CloudFront function
        run: |
          ETAG=$(aws cloudfront describe-function --name ${{ vars.FUNCTION_NAME }} --query ETag --output text)
          ETAG=$(aws cloudfront update-function --name ${{ vars.FUNCTION_NAME }} --if-match "$ETAG" \
            --function-config Comment="metquay routing",Runtime=cloudfront-js-2.0 \
            --function-code fileb://infra/cloudfront-function.js --query ETag --output text)
          aws cloudfront publish-function --name ${{ vars.FUNCTION_NAME }} --if-match "$ETAG"
      - name: Invalidate cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.DISTRIBUTION_ID }} --paths "/*"
